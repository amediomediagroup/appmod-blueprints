name: Reusable Third-Party Helm Import

on:
  workflow_call:
    inputs:
      vendor:
        required: true
        type: string
        description: "Vendor namespace (e.g. apache, devlake, fluxcd)"
      chart_name:
        required: true
        type: string
        description: "Upstream chart name"
      version:
        required: true
        type: string
        description: "Upstream chart version"
      upstream_repo_url:
        required: true
        type: string
        description: "Upstream Helm repository URL"

jobs:
  import-helm-chart:
    name: Import Third-Party Helm Chart to GHCR OCI Mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          pip install pyyaml==6.0.2

      - name: Install Hardened Toolchain (Helm, Skopeo, Cosign)
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          sudo apt-get update && sudo apt-get install -y skopeo jq

          # Helm v3.16.3
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz
          echo "f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/"

          # Cosign v2.4.1
          curl -fsSL -o "$HOME/.local/bin/cosign" https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          echo "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  $HOME/.local/bin/cosign" | sha256sum -c -
          chmod +x "$HOME/.local/bin/cosign"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Import & Cosign Sign Third-Party Helm Chart
        id: import
        run: |
          chmod +x scripts/supply-chain/*.sh scripts/supply-chain/*.py
          ./scripts/supply-chain/import-third-party-helm.sh \
            "${{ inputs.vendor }}" \
            "${{ inputs.chart_name }}" \
            "${{ inputs.version }}" \
            "${{ inputs.upstream_repo_url }}"

          # Pull chart .tgz into /tmp for image extraction
          mkdir -p /tmp/chart-pull
          if echo "${{ inputs.upstream_repo_url }}" | grep -q "^oci://"; then
            helm pull "${{ inputs.upstream_repo_url }}/${{ inputs.chart_name }}" \
              --version "${{ inputs.version }}" \
              -d /tmp/chart-pull
          else
            helm pull "${{ inputs.chart_name }}" \
              --repo "${{ inputs.upstream_repo_url }}" \
              --version "${{ inputs.version }}" \
              -d /tmp/chart-pull
          fi

          TGZ=$(ls /tmp/chart-pull/*.tgz 2>/dev/null | head -1)
          if [ -n "$TGZ" ]; then
            IMAGES=$(python3 scripts/supply-chain/extract-chart-images.py "$TGZ" --json)
            echo "images=$IMAGES" >> $GITHUB_OUTPUT
            echo "tgz=$TGZ" >> $GITHUB_OUTPUT
          else
            echo "images=[]" >> $GITHUB_OUTPUT
            echo "tgz=" >> $GITHUB_OUTPUT
          fi

      - name: Sync & Sign Container Images Bundled in Chart
        if: steps.import.outputs.images != '[]' && steps.import.outputs.images != ''
        env:
          UPSTREAM_MIRROR_REGISTRY: ghcr.io/amediomediagroup/upstream
          IMAGES_JSON: ${{ steps.import.outputs.images }}
        run: |
          chmod +x scripts/supply-chain/*.sh

          echo "$IMAGES_JSON" | python3 - << 'PYEOF'
          import json, os, subprocess, sys, re

          images = json.loads(os.environ["IMAGES_JSON"])
          registry = os.environ["UPSTREAM_MIRROR_REGISTRY"]

          def canonical(ref):
              # Strip registry prefix, use repo+tag as canonical name
              # e.g. docker.io/library/nginx:1.25 → nginx:1.25
              #      quay.io/prometheus/prometheus:v2.53.0 → prometheus/prometheus:v2.53.0
              ref = ref.replace("docker.io/library/", "").replace("docker.io/", "")
              return ref

          skipped = 0
          mirrored = 0
          failed = 0

          for img in images:
              canonical_name = canonical(img)
              dest = f"{registry}/{canonical_name}"
              print(f"\n→ Mirroring: {img}")
              print(f"  Dest:      {dest}")

              # skopeo copy --all (preserve multi-arch)
              cp = subprocess.run(
                  ["skopeo", "copy", "--all",
                   "--retry-times", "3",
                   f"docker://{img}",
                   f"docker://{dest}"],
                  capture_output=True, text=True
              )
              if cp.returncode != 0:
                  print(f"  [WARN] skopeo copy failed: {cp.stderr.strip()[:200]}", file=sys.stderr)
                  failed += 1
                  continue

              # Resolve digest for cosign
              insp = subprocess.run(
                  ["skopeo", "inspect", f"docker://{dest}"],
                  capture_output=True, text=True
              )
              digest = ""
              if insp.returncode == 0:
                  try:
                      digest = json.loads(insp.stdout).get("Digest", "")
                  except Exception:
                      pass

              if digest:
                  sign_ref = f"{registry}/{canonical_name.split(':')[0]}@{digest}"
                  sign = subprocess.run(
                      ["cosign", "sign", "--yes", sign_ref],
                      capture_output=True, text=True
                  )
                  if sign.returncode == 0:
                      print(f"  ✓ Signed {sign_ref}")
                  else:
                      print(f"  [WARN] cosign sign failed: {sign.stderr.strip()[:200]}", file=sys.stderr)
              else:
                  print(f"  [WARN] could not resolve digest for signing", file=sys.stderr)

              mirrored += 1

          print(f"\nSummary: {mirrored} mirrored, {failed} failed, {skipped} skipped")
          if failed > 0:
              print(f"[WARN] {failed} images failed — check logs above", file=sys.stderr)
          PYEOF
