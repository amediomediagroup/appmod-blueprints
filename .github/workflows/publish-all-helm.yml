name: Publish All First-Party Helm OCI Charts

on:
  push:
    paths:
      - 'platform-charts/**'
      - 'gitops/addons/charts/**'
      - '.github/workflows/publish-helm.yml'
      - '.github/workflows/publish-all-helm.yml'
  workflow_dispatch:

jobs:
  discover-charts:
    name: Discover Charts for Publication
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml==6.0.2

      - name: Discover Helm Charts
        id: set-matrix
        run: |
          python3 -c "
          import sys, json, importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('discover_helm', Path('scripts/supply-chain/discover-helm.py').resolve())
          discover_helm = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(discover_helm)
          charts = discover_helm.discover_helm_charts('.')
          # Include all first-party charts under platform-charts
          candidates = [c['chart_dir'] for c in charts if 'platform-charts' in c['source_path']]
          print('matrix=' + json.dumps(candidates))
          " >> $GITHUB_OUTPUT

  publish-charts:
    needs: discover-charts
    strategy:
      matrix:
        chart_path: ${{ fromJSON(needs.discover-charts.outputs.matrix) }}
    uses: ./.github/workflows/publish-helm.yml
    with:
      chart_path: ${{ matrix.chart_path }}
