name: Reusable Helm OCI Publisher

on:
  workflow_call:
    inputs:
      chart_path:
        required: true
        type: string
        description: "Path to Helm chart directory"

jobs:
  publish-helm-oci:
    name: Package and Push Helm Chart to OCI Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Hardened Helm Toolchain
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz
          echo "c830a3f89025fa2dd910f54e17efee83dd4fa75fb98a4422e118ae26c929a508  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/"

      - name: Log in to GitHub Container Registry (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Dependencies, Lint, and Package Chart
        id: package
        run: |
          CHART_DIR="${{ inputs.chart_path }}"

          # Build dependencies if Chart.yaml specifies dependencies
          if grep -q "dependencies:" "$CHART_DIR/Chart.yaml"; then
            helm dependency build "$CHART_DIR"
          fi

          # Lint chart
          helm lint "$CHART_DIR"

          # Package chart into temporary directory
          mkdir -p /tmp/chart-pkg
          helm package "$CHART_DIR" -d /tmp/chart-pkg

          PKG_FILE=$(ls /tmp/chart-pkg/*.tgz | head -n 1)
          echo "PKG_FILE=$PKG_FILE" >> $GITHUB_OUTPUT

      - name: Push Chart to OCI Registry
        run: |
          PKG_FILE="${{ steps.package.outputs.PKG_FILE }}"
          # Push to oci://ghcr.io/amediomediagroup/charts without appending chart name/version
          helm push "$PKG_FILE" oci://ghcr.io/amediomediagroup/charts
