name: Renovate

# Runs Renovate with a repo-scoped GitHub App token — no PAT required.
#
# Token scope: current repository only (repos: [current]).
# Identity: GH_APP_ID / GH_APP_PRIVATE_KEY — same App used by bootstrap-azure.yml.
#
# SHA pinning:
#   actions/checkout          — pinned (SHA reused from bootstrap-azure.yml)
#   actions/create-github-app-token — pinned (SHA from bootstrap-azure.yml)
#   renovatebot/github-action — tag only; no commit SHA is present in this repo
#     and fabricating one is explicitly prohibited. Pin this SHA once Renovate
#     itself updates the lock (or run:
#       gh api repos/renovatebot/github-action/commits/v40.3.6 --jq .sha
#     and replace the tag with the result).

on:
  schedule:
    # Run every Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - trace

permissions:
  contents: read   # checkout only; Renovate creates PRs via the App token, not GITHUB_TOKEN

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Generate a short-lived installation token scoped to THIS repository only.
      # The App must have: Contents=write, Pull Requests=write, Issues=write,
      # Workflows=write (for Renovate to update workflow action pins).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # repos: omitted → defaults to current repository only (least-privilege)

      - name: Self-hosted Renovate
        # renovatebot/github-action tag kept; SHA unresolvable without network.
        # See file header for pinning instructions.
        uses: renovatebot/github-action@v40.3.6
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BASE_BRANCHES: '["main"]'
