name: PR Lint

# Runs on every pull request:
#   1. Gitleaks   — detect secrets/credentials accidentally committed
#   2. PR title   — enforce Conventional Commits spec on PR title
#                   (used as squash commit message when merging)
#
# Conventional Commits format: <type>(<scope>): <description>
# Types: feat, fix, docs, chore, refactor, perf, test, ci, build, revert
# Examples:
#   feat(azure): add kind-crossplane-azure bootstrap provider
#   fix(azure-bootstrap): AADSTS700213 federated credential mismatch
#   chore(deps): bump actions/checkout from v6 to v7
#
# NOTE: gitleaks/gitleaks-action and amannn/action-semantic-pull-request
# must be added to the org's allowed actions list:
#   Org Settings → Actions → General → Allow select actions → add patterns:
#     gitleaks/gitleaks-action@*
#     amannn/action-semantic-pull-request@*

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # Post comment on violation

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits in PR

      - name: Gitleaks — detect secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # optional — free for public repos

  conventional-commits:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            ci
            build
            revert
          requireScope: false
          validateSingleCommit: false
          ignoreLabels: |
            bot
            dependencies
