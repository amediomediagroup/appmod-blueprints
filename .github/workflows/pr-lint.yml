name: PR Lint

# Enterprise-level PR quality gates:
#   1. pre-commit  — file hygiene, terraform fmt/validate/tflint, conventional commit title
#   2. Gitleaks    — scan PR commits only (not full history) for new secrets
#
# Local setup:
#   brew install pre-commit
#   pre-commit install            # installs commit hooks
#   pre-commit install --hook-type commit-msg   # installs conventional commit check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # needed for gitleaks PR scan

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit==4.2.0

      - name: Install gitleaks v8.30.1
        run: |
          curl -sSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: pre-commit (file hygiene + terraform + PR title)
        env:
          # Skip gitleaks hook — handled separately with PR-scoped scan below
          SKIP: gitleaks
          PRE_COMMIT_HOME: /tmp/pre-commit-cache
        run: |
          # Only check files changed in this PR — not --all-files (would fail on pre-existing issues)
          pre-commit run \
            --from-ref "origin/${{ github.base_ref }}" \
            --to-ref HEAD \
            --show-diff-on-failure

      - name: Gitleaks — scan PR commits only
        run: |
          # Only scan new commits in this PR (not full 4000+ commit history)
          gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --log-opts="origin/${{ github.base_ref }}..HEAD" \
            --exit-code=1 \
            --redact \
            --log-level=warn \
            --no-banner \
            && echo "✓ No new secrets in PR commits" \
            || { echo "❌ New secrets detected in PR commits"; exit 1; }

      - name: PR title — Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|chore|refactor|perf|test|ci|build|revert)(\([a-z0-9._/-]+\))?(!)?: .{1,100}$'
          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "✓ PR title: $PR_TITLE"
          else
            echo "❌ PR title must follow Conventional Commits: <type>(<scope>): <description>"
            echo "   Types: feat|fix|docs|chore|refactor|perf|test|ci|build|revert"
            echo "   Got: $PR_TITLE"
            exit 1
          fi
