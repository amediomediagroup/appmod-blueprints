name: PR Lint

# Runs on every pull request:
#   1. Gitleaks   — detect secrets/credentials accidentally committed (CLI, no action needed)
#   2. PR title   — enforce Conventional Commits spec (bash regex, no action needed)
#
# Both implemented as run: steps to avoid third-party action restrictions.
#
# Conventional Commits format: <type>(<scope>): <description>
# Types: feat, fix, docs, chore, refactor, perf, test, ci, build, revert
# Examples:
#   feat(azure): add kind-crossplane-azure bootstrap provider
#   fix(azure-bootstrap): AADSTS700213 federated credential mismatch

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: PR Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for gitleaks

      - name: Install Gitleaks v8.30.1
        run: |
          curl -sSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks — detect secrets
        run: |
          gitleaks detect \
            --source=. \
            --log-level=warn \
            --exit-code=1 \
            --redact \
            2>&1 || {
            echo ""
            echo "❌ Gitleaks found potential secrets in this PR."
            echo "   Review the output above and remove/rotate any credentials."
            exit 1
          }
          echo "✓ No secrets detected"

      - name: PR title — Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Conventional Commits: <type>[(<scope>)][!]: <description>
          PATTERN='^(feat|fix|docs|chore|refactor|perf|test|ci|build|revert)(\([a-z0-9._/-]+\))?(!)?: .{1,100}$'

          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "✓ PR title follows Conventional Commits: $PR_TITLE"
          else
            echo "❌ PR title does not follow Conventional Commits spec."
            echo ""
            echo "   Got:      $PR_TITLE"
            echo "   Expected: <type>(<scope>): <description>"
            echo ""
            echo "   Valid types: feat, fix, docs, chore, refactor, perf, test, ci, build, revert"
            echo "   Examples:"
            echo "     feat(azure): add AKS cluster provider"
            echo "     fix(bootstrap): AADSTS700213 federated credential mismatch"
            echo "     chore(deps): bump actions/checkout from v6 to v7"
            exit 1
          fi
