name: Bootstrap Azure Platform

# Runs the Terraform bootstrap that creates:
#   - GitHub environment "azure-hub" with UAMI + federated credentials (via AVM module)
#   - Bootstrap Key Vault with platform-config secret
#   - Hub resource group
#   - GitHub secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, BOOTSTRAP_KV_NAME
#
# Prerequisites (one-time, run scripts/init.sh):
#   - Storage account for Terraform state
#   - Initial UAMI + federated credential for this workflow
#   - GitHub secrets: AZURE_BOOTSTRAP_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# After bootstrap completes, use deploy-azure-hub.yml for actual platform deployment.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan
  push:
    branches: [main]
    paths:
      - "cluster-providers/kind-crossplane-azure/bootstrap/**"

permissions:
  id-token: write       # OIDC federation
  contents: read
  security-events: write  # Trivy SARIF upload

jobs:
  # ── Security scanning ────────────────────────────────────────────────────
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cluster-providers/kind-crossplane-azure/bootstrap

    steps:
      - uses: actions/checkout@v7

      - name: TFLint — Terraform linting
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: latest

      - name: TFLint init + run
        run: |
          tflint --init
          tflint --format compact || true   # warn only, don't block

      - name: OPA — validate policy syntax
        uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest

      - name: OPA check (syntax validate Rego policies)
        run: |
          opa check policies/
          echo "✓ OPA policy syntax valid"
          # Full eval runs post-plan in terraform job using tfplan JSON output
          else
            echo "No OPA policies found — skipping eval"
          fi

      - name: Checkov — IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: cluster-providers/kind-crossplane-azure/bootstrap
          framework: terraform
          output_format: cli
          soft_fail: true   # warn only during bootstrap phase

      # NOTE: trivy-action v0.36.0+ is safe (supply chain attack was 2026-03-19,
      # patched 2026-04-22). Do NOT use versions 0.28.0–0.35.x without SHA pinning.
      - name: Trivy — filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: cluster-providers/kind-crossplane-azure/bootstrap
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0   # warn only

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ── Terraform ─────────────────────────────────────────────────────────────
  terraform:
    runs-on: ubuntu-latest
    needs: scan
    environment: bootstrap   # optional — create in GitHub for approval gates
    defaults:
      run:
        working-directory: cluster-providers/kind-crossplane-azure/bootstrap
    env:
      ARM_USE_OIDC: "true"
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      # GH_PAT needs scopes: read:org, repo (for AVM module to read org + create environments)
      # Create at https://github.com/settings/tokens and add as repo secret GH_PAT
      # Sensitive vars — never hardcoded
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_platform_domain: ${{ secrets.PLATFORM_DOMAIN }}
      # Non-sensitive vars — from repository variables
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_hub_resource_group: ${{ vars.HUB_RESOURCE_GROUP }}
      TF_VAR_hub_cluster_name: ${{ vars.HUB_CLUSTER_NAME }}
      TF_VAR_bootstrap_keyvault_name: ${{ vars.BOOTSTRAP_KV_NAME }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_resource_name_location_short: ${{ vars.LOCATION_SHORT }}

    steps:
      - uses: actions/checkout@v7

      # Authenticate using the initial bootstrap UAMI (created by scripts/init.sh)
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.11"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform apply -destroy -auto-approve tfplan
