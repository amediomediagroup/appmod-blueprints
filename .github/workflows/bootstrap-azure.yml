name: Bootstrap Azure Platform

# ─────────────────────────────────────────────────────────────────────────────
# Trigger → Job matrix
# ─────────────────────────────────────────────────────────────────────────────
#
#  Event                          setup  validate  plan/env  apply/env  destroy/env
#  ─────────────────────────────  ─────  ────────  ────────  ─────────  ───────────
#  pull_request (bootstrap/**)     ✓       ✓         ✓         –          –       PR preview
#  push main (bootstrap/**)        ✓       ✓         ✓         ✓          –       Auto-apply [env gate]
#  workflow_dispatch action=plan   ✓       ✓         ✓         –          –       Manual preview
#  workflow_dispatch action=apply  ✓       ✓         ✓         ✓          –       Manual [env gate]
#  workflow_dispatch action=dest.  ✓       ✓         ✓         –          ✓       Manual [env gate]
#  schedule (02:00 UTC daily)      ✓       –         ✓         –          –       Drift detection
#
# Per-env gates (environment:bootstrap-{env}):
#   dev  → no approval, no wait
#   test → 2min wait
#   stg  → required reviewer + 5min wait
#   prod → required reviewer + 10min wait + prevent self-review
# ─────────────────────────────────────────────────────────────────────────────
#
# Two UAMIs:
#   AZURE_READONLY_CLIENT_ID   — Reader, federated: pull_request + ref:main
#   AZURE_BOOTSTRAP_CLIENT_ID  — Contributor + UAA, federated: environment:bootstrap
#
# Required secrets:
#   AZURE_BOOTSTRAP_CLIENT_ID, AZURE_READONLY_CLIENT_ID (optional, fallback to bootstrap)
#   AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   GH_APP_ID, GH_APP_PRIVATE_KEY (GitHub App for AVM github provider — no PAT needed)
#   PLATFORM_DOMAIN
#   INFRACOST_API_KEY (optional — https://www.infracost.io/docs/#2-get-api-key)
# Required vars:
#   AZURE_LOCATION, HUB_RESOURCE_GROUP, HUB_CLUSTER_NAME, BOOTSTRAP_KV_NAME
#   ACR_NAME, LOCATION_SHORT, TF_BACKEND_RESOURCE_GROUP, TF_BACKEND_STORAGE_ACCOUNT

on:
  pull_request:
    branches: [main]
    paths:
      - "cluster-providers/kind-crossplane-azure/bootstrap/**"

  # push main → validate + plan + apply (per-env gate)
  # Each env gated by its own environment: dev=auto, test=2min, stg=approval, prod=approval+10min
  push:
    branches: [main]
    paths:
      - "cluster-providers/kind-crossplane-azure/bootstrap/**"

  workflow_dispatch:
    inputs:
      environments:
        description: "Environments to run (dev,test,stg,prod or 'all')"
        default: "all"
      action:
        description: "Action"
        type: choice
        options: [plan, apply, destroy]
        default: plan

  schedule:
    - cron: "0 2 * * *"   # Daily drift detection 02:00 UTC

# Concurrency: per-job (see each job's concurrency block)
# Plan: cancel-in-progress — new push cancels old plan runs safely
# Apply/Destroy: cancel-in-progress=false, independent group from plan
# → apply is NEVER blocked by a running plan; gate = environment only

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write
  security-events: write

# Shared NON-SENSITIVE vars only — available to all jobs
# Secrets (TF_VAR_subscription_id, tenant_id, platform_domain, GITHUB_TOKEN)
# are scoped to individual job env: blocks to satisfy CKV_GIT_4
env:
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_hub_resource_group: ${{ vars.HUB_RESOURCE_GROUP }}
  TF_VAR_hub_cluster_name: ${{ vars.HUB_CLUSTER_NAME }}
  TF_VAR_bootstrap_keyvault_name: ${{ vars.BOOTSTRAP_KV_NAME }}
  TF_VAR_acr_name: ${{ vars.ACR_NAME }}
  TF_VAR_github_org: ${{ github.repository_owner }}
  TF_VAR_github_repo: ${{ github.event.repository.name }}
  TF_VAR_resource_name_location_short: ${{ vars.LOCATION_SHORT }}
  # Terraform provider cache — shared across all jobs on the same runner
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

# ── 1. Setup — detect which environments changed ──────────────────────────────
# Uses dorny/paths-filter@v4 to detect which env files changed.
# Rules:
#   envs/dev.tfvars changed   → matrix: [dev]
#   main.tf / *.tf changed    → matrix: [dev, test, stg, prod]  (shared code)
#   workflow_dispatch          → uses inputs.environments
#   schedule                  → all envs (drift detection)
jobs:
  setup:
    name: Detect changed environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      has_envs: ${{ steps.compute.outputs.has_envs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            shared:
              - 'cluster-providers/kind-crossplane-azure/bootstrap/*.tf'
              - 'cluster-providers/kind-crossplane-azure/bootstrap/policies/**'
            dev:
              - 'cluster-providers/kind-crossplane-azure/bootstrap/envs/dev.tfvars'
            test:
              - 'cluster-providers/kind-crossplane-azure/bootstrap/envs/test.tfvars'
            stg:
              - 'cluster-providers/kind-crossplane-azure/bootstrap/envs/stg.tfvars'
            prod:
              - 'cluster-providers/kind-crossplane-azure/bootstrap/envs/prod.tfvars'

      - name: Compute environment matrix
        id: compute
        env:
          MANUAL_ENVS: ${{ github.event.inputs.environments || '' }}
          SHARED: ${{ steps.filter.outputs.shared || 'false' }}
          DEV:    ${{ steps.filter.outputs.dev    || 'false' }}
          TEST:   ${{ steps.filter.outputs.test   || 'false' }}
          STG:    ${{ steps.filter.outputs.stg    || 'false' }}
          PROD:   ${{ steps.filter.outputs.prod   || 'false' }}
        run: |
          ALL='["dev","test","stg","prod"]'

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Drift detection — always all envs
            ENVS="$ALL"

          elif [ -n "$MANUAL_ENVS" ]; then
            # Manual dispatch — explicit env list or "all"
            if [ "$MANUAL_ENVS" = "all" ]; then
              ENVS="$ALL"
            else
              ENVS=$(echo "$MANUAL_ENVS" | tr ',' '\n' | jq -R . | jq -sc .)
            fi

          elif [ "$SHARED" = "true" ]; then
            # Shared .tf files changed → all envs
            echo "Shared Terraform code changed → running all environments"
            ENVS="$ALL"

          else
            # Only specific env tfvars changed → targeted envs only
            DETECTED=""
            [ "$DEV"  = "true" ] && DETECTED="$DETECTED dev"
            [ "$TEST" = "true" ] && DETECTED="$DETECTED test"
            [ "$STG"  = "true" ] && DETECTED="$DETECTED stg"
            [ "$PROD" = "true" ] && DETECTED="$DETECTED prod"
            ENVS=$(echo "$DETECTED" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
            [ "$ENVS" = "null" ] || [ -z "$ENVS" ] && ENVS="[]"
          fi

          echo "matrix={\"env\":$ENVS}" >> "$GITHUB_OUTPUT"
          [ "$ENVS" = "[]" ] && echo "has_envs=false" >> "$GITHUB_OUTPUT" \
                              || echo "has_envs=true"  >> "$GITHUB_OUTPUT"
          echo "Environments: $ENVS"

# ── 2. Validate ───────────────────────────────────────────────────────────────
# Runs AFTER setup — skip if no envs detected (nothing to validate)
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [setup]
    # Skip if: schedule (drift, no validate needed) OR no envs changed
    if: github.event_name != 'schedule' && needs.setup.outputs.has_envs == 'true'
    defaults:
      run:
        working-directory: cluster-providers/kind-crossplane-azure/bootstrap

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Terraform plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('cluster-providers/kind-crossplane-azure/bootstrap/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-

      - name: Cache Terraform modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cluster-providers/kind-crossplane-azure/bootstrap/.terraform/modules
          key: ${{ runner.os }}-terraform-modules-${{ hashFiles('cluster-providers/kind-crossplane-azure/bootstrap/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-modules-

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.11"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true   # warn, don't block on fmt

      - name: terraform validate
        run: |
          terraform init -backend=false   # init without backend for validation only
          terraform validate -no-color

      - name: TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: latest

      - run: |
          tflint --init
          tflint --format compact || true

      - name: OPA — validate policy syntax
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: latest

      - run: |
          opa check policies/
          echo "✓ Rego syntax valid"

      - name: Checkov — IaC scan
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12
        with:
          directory: cluster-providers/kind-crossplane-azure/bootstrap
          framework: terraform
          output_format: cli
          soft_fail: true

      # trivy-action v0.36.0+ — safe post supply chain attack (2026-03-19/2026-04-22)
      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: cluster-providers/kind-crossplane-azure/bootstrap
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

# ── 2. Plan ───────────────────────────────────────────────────────────────────
# Runs on: PR (read-only UAMI), workflow_dispatch, schedule (drift)
# No gate — plan is always safe to run
  plan:
    name: Plan / ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: [setup, validate]
    if: |
      always() &&
      needs.setup.outputs.has_envs == 'true' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false   # all envs plan in parallel
    # Plan: cancel older runs (read-only, safe) — independent group from apply
    concurrency:
      group: plan-${{ matrix.env }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: cluster-providers/kind-crossplane-azure/bootstrap
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
      summary: ${{ steps.summary.outputs.text }}
    env:
      ARM_USE_OIDC: "true"
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Read-only UAMI for plan — Reader only, safe on untrusted PRs
      ARM_CLIENT_ID: ${{ secrets.AZURE_READONLY_CLIENT_ID || secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
      # Secrets scoped to this job only (CKV_GIT_4)
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_platform_domain: ${{ secrets.PLATFORM_DOMAIN }}
      # Job-level so env.INFRACOST_API_KEY is available in step if: conditions
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Export GitHub token for Terraform
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GITHUB_TOKEN=${APP_TOKEN}" >> "$GITHUB_ENV"

      - name: Create Terraform plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('cluster-providers/kind-crossplane-azure/bootstrap/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-

      - name: Cache Terraform modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cluster-providers/kind-crossplane-azure/bootstrap/.terraform/modules
          key: ${{ runner.os }}-terraform-modules-${{ hashFiles('cluster-providers/kind-crossplane-azure/bootstrap/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-modules-

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_READONLY_CLIENT_ID || secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.11"

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bootstrap/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: terraform plan
        id: plan
        run: |
          set +e   # don't fail immediately — capture exit code ourselves
          terraform plan \
            -var-file="envs/${{ matrix.env }}.tfvars" \
            -out=tfplan \
            -no-color 2>&1 | tee plan.txt
          TF_EXIT=${PIPESTATUS[0]}
          echo "exitcode=$TF_EXIT" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 1 = error, 2 = changes (with -detailed-exitcode)
          # setup-terraform wrapper may pass through as-is; treat >=2 as warnings
          if [ "$TF_EXIT" -eq 1 ]; then exit 1; fi

      - name: Extract plan summary
        id: summary
        run: |
          summary=$(grep -E "^Plan:|No changes" plan.txt | head -1 || echo "Plan output unavailable")
          echo "text=$summary" >> "$GITHUB_OUTPUT"

      - name: Cost estimate (Infracost)
        if: github.event_name == 'pull_request' && env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Infracost diff
        if: github.event_name == 'pull_request' && env.INFRACOST_API_KEY != ''
        run: |
          infracost diff \
            --path=. \
            --format=json \
            --out-file=/tmp/infracost.json || true

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              'cluster-providers/kind-crossplane-azure/bootstrap/plan.txt', 'utf8'
            ).slice(0, 55000);
            const summary = `${{ steps.summary.outputs.text }}`;

            // Build cost section if infracost ran
            let costSection = '';
            try {
              const cost = JSON.parse(fs.readFileSync('/tmp/infracost.json', 'utf8'));
              const diff = cost.diffTotalMonthlyCost || '0';
              costSection = `\n\n💰 **Estimated monthly cost change:** \`${diff} USD\``;
            } catch {}

            const body = [
              '## 🔍 Terraform Plan — Bootstrap Azure',
              '',
              `| | |`,
              `|---|---|`,
              `| **Status** | ${{ steps.plan.outputs.exitcode == '0' && '✅ No changes' || steps.plan.outputs.exitcode == '2' && '⚠️ Changes pending' || '❌ Error' }} |`,
              `| **Summary** | \`${summary}\` |`,
              `| **SHA** | \`${{ github.sha }}\` |`,
              costSection,
              '',
              '<details><summary>📋 Full plan output</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
              '',
              '> **Apply:** `gh workflow run bootstrap-azure.yml --field action=apply`',
              '> Requires approval + 5 min wait (environment: `bootstrap`)'
            ].join('\n');

            // Delete previous plan comments
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            for (const c of comments) {
              if (c.body.includes('Terraform Plan — Bootstrap Azure')) {
                await github.rest.issues.deleteComment({
                  comment_id: c.id, owner: context.repo.owner, repo: context.repo.repo
                });
              }
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ matrix.env }}-${{ github.sha }}
          path: cluster-providers/kind-crossplane-azure/bootstrap/tfplan
          retention-days: 7
          if-no-files-found: error

      - name: Open drift issue
        if: github.event_name == 'schedule' && steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '⚠️ [Drift] Bootstrap Azure infrastructure out of sync',
              body: [
                '### Infrastructure drift detected',
                '`terraform plan` found uncommitted changes.',
                '',
                `**Summary:** ${{ steps.summary.outputs.text }}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '**To review:**',
                '```sh',
                'gh workflow run bootstrap-azure.yml --field action=plan',
                '```'
              ].join('\n'),
              labels: ['infrastructure', 'drift', 'azure']
            });

# ── 3. Apply ──────────────────────────────────────────────────────────────────
# Gated by environment:bootstrap — required reviewer + 5min wait + prevent self-review
# Downloads exact same tfplan artifact from plan job — no drift possible
  apply:
    name: Apply / ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: [setup, plan]
    if: (github.event_name == 'push' || github.event.inputs.action == 'apply') && needs.plan.result == 'success'
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    environment: bootstrap-${{ matrix.env }}
    # Apply: independent group from plan — NEVER blocked by a running plan
    # Gate = environment:bootstrap-{env} only (reviewer + wait timer)
    concurrency:
      group: apply-${{ matrix.env }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cluster-providers/kind-crossplane-azure/bootstrap
    env:
      ARM_USE_OIDC: "true"
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
      # Secrets scoped to this job only (CKV_GIT_4)
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_platform_domain: ${{ secrets.PLATFORM_DOMAIN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Export GitHub token for Terraform
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GITHUB_TOKEN=${APP_TOKEN}" >> "$GITHUB_ENV"

      - name: Create Terraform plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('cluster-providers/kind-crossplane-azure/bootstrap/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-

      - name: Cache Terraform modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cluster-providers/kind-crossplane-azure/bootstrap/.terraform/modules
          key: ${{ runner.os }}-terraform-modules-${{ hashFiles('cluster-providers/kind-crossplane-azure/bootstrap/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-modules-

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.11"

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bootstrap/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Download plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ matrix.env }}-${{ github.sha }}
          path: cluster-providers/kind-crossplane-azure/bootstrap

      - name: terraform apply
        run: terraform apply -auto-approve tfplan
        # tfplan was produced with the correct -var-file; no need to re-pass it

      - name: Apply summary
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const status = '${{ job.status }}';
            const icon = status === 'success' ? '✅' : '❌';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: context.sha,
              state: status === 'success' ? 'success' : 'failure',
              description: `Bootstrap apply: ${status}`,
              context: 'bootstrap/apply'
            });
            core.summary
              .addHeading(`${icon} Bootstrap Apply — ${status.toUpperCase()}`)
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Plan summary', `${{ needs.plan.outputs.summary }}`],
                ['SHA', context.sha.substring(0, 7)],
                ['Actor', context.actor],
              ])
              .write();

# ── 4. Destroy ────────────────────────────────────────────────────────────────
  destroy:
    name: Destroy / ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: [setup, plan]
    if: github.event.inputs.action == 'destroy' && needs.plan.result == 'success'
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    environment: bootstrap-${{ matrix.env }}
    concurrency:
      group: apply-${{ matrix.env }}   # same group as apply — prevent apply+destroy overlap
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cluster-providers/kind-crossplane-azure/bootstrap
    env:
      ARM_USE_OIDC: "true"
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
      # Secrets scoped to this job only (CKV_GIT_4)
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_platform_domain: ${{ secrets.PLATFORM_DOMAIN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Export GitHub token for Terraform
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GITHUB_TOKEN=${APP_TOKEN}" >> "$GITHUB_ENV"

      - name: Create Terraform plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('cluster-providers/kind-crossplane-azure/bootstrap/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-

      - name: Cache Terraform modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cluster-providers/kind-crossplane-azure/bootstrap/.terraform/modules
          key: ${{ runner.os }}-terraform-modules-${{ hashFiles('cluster-providers/kind-crossplane-azure/bootstrap/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-modules-

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.11"

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bootstrap/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Download plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ matrix.env }}-${{ github.sha }}
          path: cluster-providers/kind-crossplane-azure/bootstrap

      - name: terraform destroy
        run: terraform apply -destroy -auto-approve tfplan
        # tfplan was produced with the correct -var-file; no need to re-pass it
