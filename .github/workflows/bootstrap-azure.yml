name: Bootstrap Azure Platform

# Deploy flow:
#   PR opened/updated  → scan + plan (preview, posts comment to PR)
#   workflow_dispatch  → scan + plan | apply | destroy
#                        apply/destroy gated by environment:bootstrap
#                        (required reviewer + 5min wait timer)
#
# Prerequisites (one-time, run scripts/init.sh):
#   - Storage account for Terraform state
#   - Initial UAMI + federated credential for this workflow
#   - GitHub secrets: AZURE_BOOTSTRAP_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, GH_PAT
#   - GitHub vars: AZURE_LOCATION, HUB_RESOURCE_GROUP, HUB_CLUSTER_NAME, BOOTSTRAP_KV_NAME,
#                  LOCATION_SHORT, TF_BACKEND_RESOURCE_GROUP, TF_BACKEND_STORAGE_ACCOUNT

on:
  pull_request:
    paths:
      - "cluster-providers/kind-crossplane-azure/bootstrap/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write        # OIDC federation
  contents: read
  pull-requests: write   # Post plan output as PR comment
  security-events: write # Trivy SARIF upload

jobs:
  # ── Security scanning ─────────────────────────────────────────────────────
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cluster-providers/kind-crossplane-azure/bootstrap

    steps:
      - uses: actions/checkout@v7

      - name: TFLint — Terraform linting
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: latest

      - name: TFLint init + run
        run: |
          tflint --init
          tflint --format compact || true

      - name: OPA — validate policy syntax
        uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest

      - name: OPA check
        run: |
          opa check policies/
          echo "✓ OPA policy syntax valid"

      - name: Checkov — IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: cluster-providers/kind-crossplane-azure/bootstrap
          framework: terraform
          output_format: cli
          soft_fail: true

      # trivy-action v0.36.0+ is safe — supply chain attack was 2026-03-19, patched 2026-04-22
      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: cluster-providers/kind-crossplane-azure/bootstrap
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ── Terraform ─────────────────────────────────────────────────────────────
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    needs: scan
    # environment gate only for apply/destroy — plan runs freely on PR too
    environment: ${{ (github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy') && 'bootstrap' || '' }}
    defaults:
      run:
        working-directory: cluster-providers/kind-crossplane-azure/bootstrap
    env:
      ARM_USE_OIDC: "true"
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_platform_domain: ${{ secrets.PLATFORM_DOMAIN }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_hub_resource_group: ${{ vars.HUB_RESOURCE_GROUP }}
      TF_VAR_hub_cluster_name: ${{ vars.HUB_CLUSTER_NAME }}
      TF_VAR_bootstrap_keyvault_name: ${{ vars.BOOTSTRAP_KV_NAME }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_resource_name_location_short: ${{ vars.LOCATION_SHORT }}

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.11"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan -no-color 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              'cluster-providers/kind-crossplane-azure/bootstrap/plan.txt', 'utf8'
            ).slice(0, 60000);  // GitHub comment limit
            const body = [
              '### 🔍 Terraform Plan',
              '```terraform',
              plan,
              '```',
              '',
              `> To apply: \`gh workflow run bootstrap-azure.yml --field action=apply\``
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform apply -destroy -auto-approve tfplan
