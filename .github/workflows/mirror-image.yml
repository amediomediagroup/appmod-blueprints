name: Reusable Upstream Image Mirror

on:
  workflow_call:
    inputs:
      upstream_image_ref:
        required: true
        type: string
        description: "Upstream image reference (e.g. node:20-bullseye)"
      canonical_name:
        required: true
        type: string
        description: "Canonical destination name under ghcr.io/amediomediagroup/upstream/"

jobs:
  mirror-image:
    name: Mirror Upstream OCI Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Hardened Toolchain (Skopeo, Cosign, Syft, Grype)
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          sudo apt-get update && sudo apt-get install -y skopeo jq

          # Cosign v2.4.1
          curl -fsSL -o "$HOME/.local/bin/cosign" https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          echo "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  $HOME/.local/bin/cosign" | sha256sum -c -
          chmod +x "$HOME/.local/bin/cosign"

          # Syft v1.18.0
          curl -fsSL -o /tmp/syft.tar.gz https://github.com/anchore/syft/releases/download/v1.18.0/syft_1.18.0_linux_amd64.tar.gz
          echo "0b6fd1e0dd5b00b19585e5cde8e1c1f4ef60dc8fba8b41fab55f00852a2fbb8d  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C "$HOME/.local/bin" syft

          # Grype v0.87.0
          curl -fsSL -o /tmp/grype.tar.gz https://github.com/anchore/grype/releases/download/v0.87.0/grype_0.87.0_linux_amd64.tar.gz
          echo "be710d15f5477e5c77ce03d14e480263415d7ab135e04b8483663f688823087d  /tmp/grype.tar.gz" | sha256sum -c -
          tar -xzf /tmp/grype.tar.gz -C "$HOME/.local/bin" grype

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror Multi-Arch Upstream Image & Sign Import
        run: |
          chmod +x scripts/supply-chain/*.sh
          ./scripts/supply-chain/mirror-third-party.sh "${{ inputs.upstream_image_ref }}" "${{ inputs.canonical_name }}"
