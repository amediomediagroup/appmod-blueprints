name: Supply-Chain Sentinel

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  supply-chain-sentinel:
    name: Supply-Chain Discovery & Sentinel Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install Hardened Toolchain (Skopeo, Syft, Grype, Cosign, Helm, Crane, ORAS, yq)
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Skopeo & jq
          sudo apt-get update && sudo apt-get install -y skopeo jq

          # Helm v3.16.3
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz
          echo "c830a3f89025fa2dd910f54e17efee83dd4fa75fb98a4422e118ae26c929a508  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/"

          # Syft v1.18.0
          curl -fsSL -o /tmp/syft.tar.gz https://github.com/anchore/syft/releases/download/v1.18.0/syft_1.18.0_linux_amd64.tar.gz
          echo "0b6fd1e0dd5b00b19585e5cde8e1c1f4ef60dc8fba8b41fab55f00852a2fbb8d  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C "$HOME/.local/bin" syft

          # Grype v0.87.0
          curl -fsSL -o /tmp/grype.tar.gz https://github.com/anchore/grype/releases/download/v0.87.0/grype_0.87.0_linux_amd64.tar.gz
          echo "be710d15f5477e5c77ce03d14e480263415d7ab135e04b8483663f688823087d  /tmp/grype.tar.gz" | sha256sum -c -
          tar -xzf /tmp/grype.tar.gz -C "$HOME/.local/bin" grype

          # Cosign v2.4.1
          curl -fsSL -o "$HOME/.local/bin/cosign" https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          echo "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  $HOME/.local/bin/cosign" | sha256sum -c -
          chmod +x "$HOME/.local/bin/cosign"

          # Crane v0.20.2
          curl -fsSL -o /tmp/crane.tar.gz https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz
          tar -xzf /tmp/crane.tar.gz -C "$HOME/.local/bin" crane

          # ORAS v1.2.0
          curl -fsSL -o /tmp/oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          tar -xzf /tmp/oras.tar.gz -C "$HOME/.local/bin" oras

          # yq v4.44.5
          curl -fsSL -o "$HOME/.local/bin/yq" https://github.com/mikefarah/yq/releases/download/v4.44.5/yq_linux_amd64
          chmod +x "$HOME/.local/bin/yq"

      - name: Verify Toolchain Installation
        run: |
          skopeo --version
          syft --version
          grype --version
          cosign version
          helm version
          crane version
          oras version
          python3 --version
          jq --version
          yq --version

      - name: Execute Sentinel Self-Tests
        run: |
          chmod +x scripts/supply-chain/*.sh scripts/supply-chain/*.py
          ./scripts/supply-chain/self-test.sh

      - name: Discover Artifacts & Compare Catalog
        run: |
          mkdir -p .supply-chain/findings
          python3 scripts/supply-chain/compare-catalog.py --scan --output .supply-chain/findings/findings.json
          ./scripts/supply-chain/audit-helm.sh --output .supply-chain/findings/helm-findings.json

      - name: Upload Supply Chain Findings Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: supply-chain-findings
          path: .supply-chain/findings/
          retention-days: 14
