name: Deploy Azure Hub

# SECURITY MODEL:
# - Only 3 GitHub secrets required: AZURE_CLIENT_ID, AZURE_TENANT_ID, BOOTSTRAP_KV_NAME
# - All platform config (subscription ID, location, domain, cluster name, etc.)
#   is fetched from the Bootstrap Key Vault at runtime — NEVER stored in GitHub.
# - All sensitive values are masked via ::add-mask:: before use.
# - No customer PII appears in workflow logs or code.
#
# Trigger: manual only (workflow_dispatch)
# Gate:    environment:azure-hub (required reviewer + wait timer)
#          environment:azure-hub-destroy for destructive actions (extra protection)
#
# Actions:
#   install      — provision AKS + bootstrap platform (idempotent)
#   status       — show current cluster and ArgoCD sync status
#   destroy-kind — delete local Kind bootstrap cluster only (AKS persists)
#   destroy      — ⚠️ FULL TEARDOWN — deletes AKS cluster and all resources

on:
  workflow_dispatch:
    inputs:
      hub_cluster_name:
        description: "Hub AKS cluster name"
        required: true
      kubernetes_version:
        description: "AKS Kubernetes version (e.g. 1.37)"
        required: false
        default: "1.37"
      action:
        description: "Action to run"
        type: choice
        options: [install, status, destroy-kind, destroy]
        default: install

# Prevent concurrent deploys to the same cluster
concurrency:
  group: deploy-azure-hub-${{ inputs.hub_cluster_name }}
  cancel-in-progress: false   # never cancel a running deploy

permissions:
  id-token: write   # OIDC federation
  contents: read

jobs:
  deploy:
    name: ${{ inputs.action }} — ${{ inputs.hub_cluster_name }}
    runs-on: ubuntu-24.04   # pinned — ubuntu-latest migrates to Ubuntu 26 on Oct 19 2026
    timeout-minutes: 90     # task install can take 45-60min; give headroom
    # Destructive actions use a separate environment with extra protection
    environment: ${{ (inputs.action == 'destroy') && 'azure-hub-destroy' || 'azure-hub' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Authenticate with Azure using OIDC — subscription fetched from KV, not hardcoded
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: latest

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x

      - name: Install yq + kind
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          curl -Lo /tmp/kind \
            https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind

      # Fetch ALL config from Bootstrap Key Vault — mask every sensitive value
      - name: Fetch config from Bootstrap Key Vault
        run: |
          CONFIG=$(az keyvault secret show \
            --vault-name "${{ secrets.BOOTSTRAP_KV_NAME }}" \
            --name "platform-config" \
            --query value -o tsv)

          # Extract and mask each sensitive value before use
          SUB_ID=$(echo "$CONFIG" | jq -r '.subscriptionId')
          echo "::add-mask::$SUB_ID"

          TENANT_ID=$(echo "$CONFIG" | jq -r '.tenantId // ""')
          [ -n "$TENANT_ID" ] && echo "::add-mask::$TENANT_ID"

          LOCATION=$(echo "$CONFIG" | jq -r '.location')
          DOMAIN=$(echo "$CONFIG" | jq -r '.domain')
          echo "::add-mask::$DOMAIN"

          RG=$(echo "$CONFIG" | jq -r '.resourceGroup')
          REPO_URL=$(echo "$CONFIG" | jq -r '.repoUrl')
          REPO_REV=$(echo "$CONFIG" | jq -r '.repoRevision // "main"')
          PREFIX=$(echo "$CONFIG" | jq -r '.resourcePrefix // ""')
          UAMI_CLIENT_ID=$(echo "$CONFIG" | jq -r '.uamiClientId // ""')
          [ -z "$UAMI_CLIENT_ID" ] && UAMI_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}"
          echo "::add-mask::$UAMI_CLIENT_ID"

          # Derive cluster KV name from cluster name (convention: first 12 chars + -kv)
          CLUSTER="${{ inputs.hub_cluster_name }}"
          KV_NAME="${CLUSTER:0:12}-kv"

          # Set subscription context
          az account set --subscription "$SUB_ID"

          # Write to GITHUB_ENV (values already masked above)
          {
            echo "AZURE_SUB_ID=$SUB_ID"
            echo "AZURE_LOCATION=$LOCATION"
            echo "AZURE_RG=$RG"
            echo "PLATFORM_DOMAIN=$DOMAIN"
            echo "REPO_URL=$REPO_URL"
            echo "REPO_REVISION=$REPO_REV"
            echo "RESOURCE_PREFIX=$PREFIX"
            echo "AZURE_UAMI_CLIENT_ID=$UAMI_CLIENT_ID"
            echo "AZURE_KV_NAME=$KV_NAME"
          } >> "$GITHUB_ENV"

      # Build config.local.yaml entirely from masked env vars — no PII in file
      - name: Prepare config.local.yaml
        run: |
          CLUSTER="${{ inputs.hub_cluster_name }}"
          K8S_VERSION="${{ inputs.kubernetes_version }}"
          cp config.yaml config.local.yaml

          yq -i '.clusterProvider = "kind-crossplane-azure"'              config.local.yaml
          yq -i ".hub.clusterName = \"${CLUSTER}\""                       config.local.yaml
          yq -i ".hub.kubernetesVersion = \"${K8S_VERSION}\""             config.local.yaml
          yq -i ".azure.subscriptionId = \"${AZURE_SUB_ID}\""             config.local.yaml
          yq -i ".azure.tenantId = \"${{ secrets.AZURE_TENANT_ID }}\""    config.local.yaml
          yq -i ".azure.location = \"${AZURE_LOCATION}\""                 config.local.yaml
          yq -i ".azure.uamiClientId = \"${AZURE_UAMI_CLIENT_ID}\""       config.local.yaml
          yq -i ".azure.resourceGroup = \"${AZURE_RG}\""                  config.local.yaml
          yq -i ".azure.keyVaultName = \"${AZURE_KV_NAME}\""              config.local.yaml
          yq -i ".domain = \"${PLATFORM_DOMAIN}\""                        config.local.yaml
          yq -i ".repo.url = \"${REPO_URL}\""                             config.local.yaml
          yq -i ".repo.revision = \"${REPO_REVISION}\""                   config.local.yaml
          yq -i '.repo.basepath = "gitops/"'                              config.local.yaml
          [ -n "$RESOURCE_PREFIX" ] && \
            yq -i ".resourcePrefix = \"${RESOURCE_PREFIX}\""              config.local.yaml

          echo "config.local.yaml prepared (values masked in logs)"

      - name: Run task
        run: task kind-crossplane-azure:${{ inputs.action }}
        env:
          KUBECONFIG: ${{ github.workspace }}/private/kubeconfig

      - name: Deploy summary
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const status = '${{ job.status }}';
            const icon = status === 'success' ? '✅' : status === 'cancelled' ? '⏹️' : '❌';
            const action = '${{ inputs.action }}';
            const cluster = '${{ inputs.hub_cluster_name }}';
            const k8sVer = '${{ inputs.kubernetes_version }}';

            await core.summary
              .addHeading(`${icon} Deploy Azure Hub — ${action.toUpperCase()}`)
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Cluster', cluster],
                ['Action', action],
                ['K8s version', k8sVer],
                ['Status', `${icon} ${status}`],
                ['Actor', context.actor],
                ['SHA', context.sha.substring(0, 7)],
              ])
              .write();
