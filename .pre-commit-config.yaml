---
# Enterprise pre-commit configuration
# Install: brew install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# CI: see .github/workflows/pr-lint.yml

repos:
  # ── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(helm-charts/|gitops/addons/charts/)  # Helm templates have {{ }}
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]

  # ── Secret detection ─────────────────────────────────────────────────────────
  # Scans staged files — no license required
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ── Terraform ────────────────────────────────────────────────────────────────
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
      - id: terraform_validate
        args:
          - --args=-no-color
        # Only validate bootstrap — other tf files may need live backend
        files: ^cluster-providers/kind-crossplane-azure/bootstrap/
      - id: terraform_tflint
        args:
          - --args=--format=compact
        files: ^cluster-providers/kind-crossplane-azure/bootstrap/

  # ── Conventional Commits (commit message) ───────────────────────────────────
  # Validates commit message format on git commit
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - chore
          - refactor
          - perf
          - test
          - ci
          - build
          - revert

# ── CI-only configuration ────────────────────────────────────────────────────
# In CI (pr-lint.yml), pre-commit runs on PR diff only:
#   SKIP=gitleaks pre-commit run --from-ref origin/main --to-ref HEAD
# Gitleaks is handled separately in CI with --log-opts="origin/main..HEAD"
# to scan only PR commits, not full 4000+ commit history.
