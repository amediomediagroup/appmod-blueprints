# DeploymentRuntimeConfig for Azure Workload Identity.
# Adds the required label to all provider pods so the azure-workload-identity
# mutating webhook injects the projected service account token.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: azure-workload-identity-drc
spec:
  deploymentTemplate:
    spec:
      # Crossplane generates the real pod selector; the CRD embeds DeploymentSpec
      # and therefore requires the field to be present.
      selector: {}
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
        spec:
          containers: []
          # Reuse the federated SA without assigning it to a package revision.
          serviceAccountName: crossplane
