# Per-addon value overrides for the control-plane-azure environment.
# Add here when an addon needs Azure-specific configuration beyond what
# the cluster secret annotations provide.

external-secrets:
  # Azure has its own ClusterSecretStore addon and workload identity federation.
  # Do not deploy the AWS Secrets Manager store or EKS credential restart hook.
  additionalResources: []

  # This hub has one availability zone; do not require a nonexistent second zone.
  valuesObject:
    replicaCount: 1
    topologySpreadConstraints: []
    serviceAccount:
      annotations:
        # Crossplane owns the ESO identity; the bootstrap seed publishes its client
        # id. index+default keeps the ApplicationSet generating when that
        # annotation is absent instead of failing the whole app.
        azure.workload.identity/client-id: '{{ index .metadata.annotations "azure_eso_mi_client_id" | default "" }}'
    podLabels:
      azure.workload.identity/use: "true"
    certController:
      replicaCount: 1
      topologySpreadConstraints: []
    webhook:
      replicaCount: 1
      topologySpreadConstraints: []

cert-manager:
  valuesObject:
    # Verified against the pinned v1.20.2 controller's actual --help.
    extraArgs:
      - --enable-gateway-api
    replicaCount: 1
    topologySpreadConstraints: []
    cainjector:
      replicaCount: 1
      topologySpreadConstraints: []
    webhook:
      replicaCount: 1
      topologySpreadConstraints: []

# agc_gateway values (subnet, TLS hostname, cert-manager issuance) are owned by
# the registry entry, which has the cluster annotations in scope.

image-prepuller:
  valuesObject:
    # Warm the enabled CPU platform, not disabled GPU/Jupyter workloads.
    images:
      - quay.io/keycloak/keycloak:26.3.3
      - docker.io/library/postgres:17.4-alpine3.21
      - public.ecr.aws/seb-demo/backstage:cnoe-1.1

argo-rollouts:
  valuesObject:
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: null

# ---------------------------------------------------------------------------
# Azure addon overrides. Values below mirror what was actually deployed and
# smoke-tested against the live cluster; the cluster secret supplies the real
# domain, cluster name and gateway identity.
# ---------------------------------------------------------------------------

keycloak:
  valuesObject:
    cloud: azure
    clusterName: '{{ .metadata.annotations.azure_cluster_name }}'
    global:
      ingress_domain_name: '{{ .metadata.annotations.ingress_domain_name }}'
      insecure: '{{ .metadata.annotations.insecure }}'
    gateway:
      enabled: true
      name: gateway-01
      namespace: azure-alb-system

backstage:
  valuesObject:
    cloud: azure
    clusterName: '{{ .metadata.annotations.azure_cluster_name }}'
    ingress_domain_name: '{{ .metadata.annotations.ingress_domain_name }}'
    insecure: '{{ .metadata.annotations.insecure }}'
    backstage_image: public.ecr.aws/seb-demo/backstage:cnoe-1.1
    global:
      aws_cluster_name: '{{ .metadata.annotations.azure_cluster_name }}'
      clusterName: '{{ .metadata.annotations.azure_cluster_name }}'
    gateway:
      enabled: true
      name: gateway-01
      namespace: azure-alb-system

argo-workflows:
  valuesObject:
    cloud: azure
    clusterName: '{{ .metadata.annotations.azure_cluster_name }}'
    aws_cluster_name: '{{ .metadata.annotations.azure_cluster_name }}'
    ingress_domain_name: '{{ .metadata.annotations.ingress_domain_name }}'
    insecure: '{{ .metadata.annotations.insecure }}'
    gateway:
      enabled: true
      name: gateway-01
      namespace: azure-alb-system

kargo:
  valuesObject:
    cloud: azure
    clusterName: '{{ .metadata.annotations.azure_cluster_name }}'
    global:
      ingress_domain_name: '{{ .metadata.annotations.ingress_domain_name }}'
      insecure: '{{ .metadata.annotations.insecure }}'
    gateway:
      enabled: true
      name: gateway-01
      namespace: azure-alb-system
    # The upstream chart injects an AWS Secrets Manager ExternalSecret through
    # extraObjects; this chart renders the Azure Key Vault one instead.
    kargo:
      extraObjects: []
      api:
        # AGC terminates TLS; the API serves HTTP behind the gateway.
        tls:
          enabled: false
          terminatedUpstream: true

devlake:
  valuesObject:
    cloud: azure
    clusterName: '{{ .metadata.annotations.azure_cluster_name }}'
    ingress_domain_name: '{{ .metadata.annotations.ingress_domain_name }}'
    insecure: '{{ .metadata.annotations.insecure }}'
    # DevLake's UI emits absolute root asset paths and its SPA cannot run under a
    # path prefix, so it is intentionally not attached to the shared gateway.
    gateway:
      enabled: false
    devlake:
      grafana:
        external:
          url: http://grafana.grafana.svc.cluster.local:3000

grafana:
  valuesObject:
    cloud: azure
    clusterName: '{{ .metadata.annotations.azure_cluster_name }}'
    ingress_domain_name: '{{ .metadata.annotations.ingress_domain_name }}'
    insecure: '{{ .metadata.annotations.insecure }}'
    global:
      clusterName: '{{ .metadata.annotations.azure_cluster_name }}'
    gateway:
      enabled: true
      name: gateway-01
      namespace: azure-alb-system

grafana-dashboards:
  valuesObject:
    cloud: azure
    clusterName: '{{ .metadata.annotations.azure_cluster_name }}'
    devlake:
      enabled: true
