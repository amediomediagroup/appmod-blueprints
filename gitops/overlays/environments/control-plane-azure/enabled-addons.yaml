# Enabled addons for the control-plane-azure environment (AKS hub).
# Azure-specific addons are ON; AWS-specific addons are OFF.
enabledAddons:
  # Azure-specific
  # agc_gateway: enabled in registry; actual deployment gated by two cluster labels:
  #   enable_agc_gateway=true  — set by bootstrap once subscription registrations are done
  #   agc_native_ready=true    — set by native_agc.py only after GatewayClass Accepted,
  #                              UpdateResource Ready/Synced, subnet delegated, and
  #                              NetworkContributor assignment Ready.
  # Requires cluster annotation azure_agc_subnet_id (full ARM subnet resource ID).
  agc_gateway: true
  azure_cluster_secret_store: true

  # Cloud-agnostic — ON
  # AKS already owns metrics-server and v1beta1.metrics.k8s.io; do not deploy a second owner.
  metrics_server: false
  cert_manager: true
  external_secrets: true
  keycloak: true
  backstage: true
  argo_events: true
  argo_rollouts: true
  argo_workflows: true
  kargo: true
  devlake: true
  grafana_operator: true
  # grafana-dashboards targets a Grafana instance; enable the instance too,
  # otherwise every dashboard/datasource CR has no matching instance.
  grafana: true
  grafana_dashboards: true
  kube_state_metrics: true
  prometheus_node_exporter: true
  image_prepuller: true

  # ArgoCD: self-hosted via Taskfile (not managed as addon)
  argocd: false

  # AWS-specific — OFF
  aws_load_balancer_controller: false
  ingress_class_alb: false
  pod_identities: false
  crossplane: false
  crossplane_pod_identity: false
  crossplane_base: false
  observability_aws: false
  aws_efs_csi_driver: false
  aws_resources: false
  multi_acct: false
  ack_iam: false
  ack_eks: false
  ack_ec2: false
  ack_ecr: false
  ack_s3: false
  ack_dynamodb: false
  kro: false
  kro_manifests: false
  kro_manifests_hub: false
  platform_manifests_bootstrap: false
  platform_manifests: false
  env_config: false
