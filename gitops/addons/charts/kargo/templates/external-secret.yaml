{{- $cloud := .Values.cloud | default "aws" -}}
{{- if eq $cloud "azure" -}}
{{- $clusterName := .Values.clusterName -}}
{{- /*
Azure: pull Kargo admin credentials from Azure Key Vault (<clusterName>-secrets).
ClusterSecretStore azure-key-vault is deployed by the azure-cluster-secret-store addon.

Required KV secret properties in <clusterName>-secrets:
  user_password_hash  → ADMIN_ACCOUNT_PASSWORD_HASH  (bcrypt hash of admin password)
  user_password_key   → ADMIN_ACCOUNT_TOKEN_SIGNING_KEY (random signing key)

Main seeds these properties via the scoped KV Secrets Officer operator before this
ExternalSecret first syncs.

AWS path: kargo-admin-credentials ExternalSecret is rendered by the upstream kargo
chart via kargo.extraObjects (registry inline, gitops.yaml); this template is
Azure-only so there is no conflict. Main must set kargo.extraObjects=[] in the Azure
overrides to suppress the AWS inline object on Azure clusters.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-admin-credentials
  namespace: kargo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  refreshInterval: "30s"
  target:
    name: kargo-admin-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        ADMIN_ACCOUNT_PASSWORD_HASH: "{{ `{{ .KARGO_ADMIN_PASSWORD_HASH }}` }}"
        ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: "{{ `{{ .KARGO_ADMIN_PASSWORD_KEY }}` }}"
  data:
    - secretKey: KARGO_ADMIN_PASSWORD_HASH
      remoteRef:
        key: {{ $clusterName }}-secrets
        property: user_password_hash
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: KARGO_ADMIN_PASSWORD_KEY
      remoteRef:
        key: {{ $clusterName }}-secrets
        property: user_password_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
