backstage_image: ""
git_username: ""
gitlab_domain_name: ""
working_repo: ""
ingress_domain_name: ""
workshop_git_branch: "main"
# spoke_clusters: list of {name, url, token} entries.
# Each entry registers a remote cluster in Backstage's Kubernetes plugin
# (kubernetes.clusters), kubernetesIngestor.clusters, and the k8s-config.yaml
# ConfigMap consumed by Argo CD. Empty list (default) means hub-only mode.
spoke_clusters: []
global:
  aws_cluster_name: ""
  clusterName: ""
# Cloud selector: "aws" (default) or "azure".
cloud: aws
# Azure Key Vault secret name prefix; defaults to the cluster name.
clusterName: ""
azure:
  # Storage class for the PostgreSQL PVC; managed-csi is the AKS default.
  storageClass: managed-csi
# Gateway API routing through the shared AGC gateway on Azure.
gateway:
  enabled: false
  name: gateway-01
  namespace: azure-alb-system
