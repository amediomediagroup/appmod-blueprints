{{- $isAzure := eq (.Values.cloud | default "aws") "azure" -}}
{{- $insecure := eq (toString (.Values.global.insecure | default "false")) "true" -}}
{{- if $isAzure }}
# Azure: Gateway API HTTPRoute via shared AGC gateway (gateway-01, azure-alb-system).
# sectionName selects the https listener when TLS is active, http for initial HTTP-only smoke.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | default "gateway-01" }}
      namespace: {{ .Values.gateway.namespace | default "azure-alb-system" }}
      sectionName: {{ if $insecure }}http{{ else }}https{{ end }}
  hostnames:
    - {{ required "global.ingress_domain_name required for Azure HTTPRoute" .Values.global.ingress_domain_name | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /keycloak
      backendRefs:
        - name: keycloak
          namespace: keycloak
          port: 8080
{{- else }}
# AWS: Application Load Balancer Ingress via ingressClassName=platform.
{{- /* insecure: HTTP-only ingress, no cert (consumer terminates TLS upstream, e.g. CloudFront). */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /keycloak/realms/master
    alb.ingress.kubernetes.io/success-codes: "200-302"
{{- if $insecure }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
{{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
{{- end }}
spec:
  ingressClassName: platform
  rules:
{{- if $insecure }}
    - http:
{{- else }}
    - host: {{ .Values.global.ingress_domain_name }}
      http:
{{- end }}
        paths:
          - path: /keycloak
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
{{- end }}
