# Keycloak secrets — pulled from the cloud-native secret store seeded during bootstrap.
#
# AWS:   ClusterSecretStore aws-secrets-manager; key <cluster>/keycloak (slash)
#          properties: keycloak_admin_password, keycloak_postgres_password, user_password
# Azure: ClusterSecretStore azure-key-vault; key <cluster>-keycloak (dash, no slash)
#          same properties; seeded by main at appmod-obs-hub-keycloak.
#        OIDC client secrets pre-seeded at <cluster>-keycloak-clients (8 *_CLIENT_SECRET
#          properties); projected into keycloak-clients-preseed for the config Job.
#
# See cluster-providers/README.md for the provider contract.
{{- $isAzure := eq (.Values.cloud | default "aws") "azure" -}}
{{- $cluster := .Values.clusterName | default .Values.aws.cluster_name -}}
{{- "" }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: argocd-store
  namespace: keycloak
spec:
  provider:
    kubernetes:
      remoteNamespace: argocd
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: keycloak-config
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: "30s"
  secretStoreRef:
{{- if $isAzure }}
    name: azure-key-vault
{{- else }}
    name: aws-secrets-manager
{{- end }}
    kind: ClusterSecretStore
  target:
    name: keycloak-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ `{{.KEYCLOAK_ADMIN_PASSWORD}}` }}"
        KC_DB_USERNAME: keycloak
        KC_DB_PASSWORD: "{{ `{{.KEYCLOAK_DB_PASSWORD}}` }}"
        POSTGRES_DB: keycloak
        POSTGRES_USER: keycloak
        POSTGRES_PASSWORD: "{{ `{{.KEYCLOAK_DB_PASSWORD}}` }}"
        USER_PASSWORD: "{{ `{{.KEYCLOAK_USER_PASSWORD}}` }}"
  data:
    - secretKey: KEYCLOAK_USER_PASSWORD
      remoteRef:
{{- if $isAzure }}
        key: {{ $cluster }}-keycloak
{{- else }}
        key: {{ .Values.aws.cluster_name }}/keycloak
{{- end }}
        property: user_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
{{- if $isAzure }}
        key: {{ $cluster }}-keycloak
{{- else }}
        key: {{ .Values.aws.cluster_name }}/keycloak
{{- end }}
        property: keycloak_admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: KEYCLOAK_DB_PASSWORD
      remoteRef:
{{- if $isAzure }}
        key: {{ $cluster }}-keycloak
{{- else }}
        key: {{ .Values.aws.cluster_name }}/keycloak
{{- end }}
        property: keycloak_postgres_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- if $isAzure }}
---
# Azure: pre-seeded OIDC client secrets from AKV key <cluster>-keycloak-clients.
# Main seeds all 8 *_CLIENT_SECRET properties with CSPRNG values before first sync.
# The keycloak-config Job reads files from /var/preseed/ and sets
# ClientRepresentation.secret on POST /clients — no server-side generation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-clients-preseed
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: keycloak-clients-preseed
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ARGO_WORKFLOWS_CLIENT_SECRET
      remoteRef:
        key: {{ $cluster }}-keycloak-clients
        property: ARGO_WORKFLOWS_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: BACKSTAGE_CLIENT_SECRET
      remoteRef:
        key: {{ $cluster }}-keycloak-clients
        property: BACKSTAGE_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: JUPYTERHUB_CLIENT_SECRET
      remoteRef:
        key: {{ $cluster }}-keycloak-clients
        property: JUPYTERHUB_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: KUBEFLOW_CLIENT_SECRET
      remoteRef:
        key: {{ $cluster }}-keycloak-clients
        property: KUBEFLOW_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: MLFLOW_CLIENT_SECRET
      remoteRef:
        key: {{ $cluster }}-keycloak-clients
        property: MLFLOW_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SPARK_CLIENT_SECRET
      remoteRef:
        key: {{ $cluster }}-keycloak-clients
        property: SPARK_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: AIRFLOW_CLIENT_SECRET
      remoteRef:
        key: {{ $cluster }}-keycloak-clients
        property: AIRFLOW_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: LANGFUSE_CLIENT_SECRET
      remoteRef:
        key: {{ $cluster }}-keycloak-clients
        property: LANGFUSE_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: keycloak
  name: eso-store
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: eso-store
    namespace: keycloak
roleRef:
  kind: Role
  name: eso-store
  apiGroup: rbac.authorization.k8s.io
