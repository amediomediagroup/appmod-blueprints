{{- $cloud := .Values.cloud | default "aws" -}}
{{- $clusterName := coalesce .Values.clusterName .Values.aws_cluster_name "" -}}
{{- if eq $cloud "azure" }}
# Azure: pull OIDC client credentials from Azure Key Vault (<clusterName>-keycloak-clients).
# ClusterSecretStore azure-key-vault is deployed by the azure-cluster-secret-store addon.
# Main seeds <clusterName>-keycloak-clients with ARGO_WORKFLOWS_CLIENT_ID and
# ARGO_WORKFLOWS_CLIENT_SECRET before this ES syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-oidc
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: keycloak-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ $clusterName }}-keycloak-clients
        property: ARGO_WORKFLOWS_CLIENT_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: secret-key
      remoteRef:
        key: {{ $clusterName }}-keycloak-clients
        property: ARGO_WORKFLOWS_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- else }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-oidc
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: keycloak-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ .Values.aws_cluster_name }}/keycloak-clients
        property: ARGO_WORKFLOWS_CLIENT_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: secret-key
      remoteRef:
        key: {{ .Values.aws_cluster_name }}/keycloak-clients
        property: ARGO_WORKFLOWS_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
