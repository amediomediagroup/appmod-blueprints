{{- if eq .Values.cloud "azure" }}
---
# Azure: Grafana admin API key from Azure Key Vault.
# AKV key: <clusterName>-secrets  property: grafana_api_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: {{ .Values.namespace | default "grafana-operator" }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
  - secretKey: GF_SECURITY_ADMIN_APIKEY
    remoteRef:
      key: {{ .Values.clusterName }}-secrets
      property: grafana_api_key
---
# Azure: Prometheus endpoint from Azure Key Vault (Azure Monitor Workspace URL).
# sigV4 is AWS-only and omitted from the datasource on Azure.
# AKV key: <clusterName>-secrets  property: amp_endpoint_url
# (property name kept consistent with AWS path for operator tooling parity)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-amp-creds
  namespace: {{ .Values.namespace | default "grafana-operator" }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: grafana-amp-creds
    creationPolicy: Owner
  data:
  - secretKey: AMP_ENDPOINT_URL
    remoteRef:
      key: {{ .Values.clusterName }}-secrets
      property: amp_endpoint_url
{{- if and .Values.devlake (eq (toString .Values.devlake.enabled) "true") }}
---
# Azure: Grafana MySQL read-only password from Azure Key Vault.
# URL is static (in-cluster MySQL); no PushSecret or remote endpoint needed.
# AKV key: <clusterName>-devlake-mysql  property: grafana_mysql_password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mysql-creds
  namespace: {{ .Values.namespace | default "grafana-operator" }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: grafana-mysql-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GRAFANA_MYSQL_PASSWORD: "{{ `{{ .grafana_mysql_password }}` }}"
        # Static in-cluster MySQL endpoint; no RDS/PushSecret needed on Azure.
        GRAFANA_MYSQL_URL: "devlake-mysql-service:3306"
  data:
  - secretKey: grafana_mysql_password
    remoteRef:
      key: {{ .Values.clusterName }}-devlake-mysql
      property: grafana_mysql_password
{{- end }}
{{- else }}
---
# AWS: Grafana admin API key from AWS Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: {{ .Values.namespace | default "grafana-operator" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
  - secretKey: GF_SECURITY_ADMIN_APIKEY
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
      key: {{ .Values.clusterName }}/secrets
      property: grafana_api_key
---
# AWS: AMP endpoint + region from AWS Secrets Manager (sigV4 auth).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-amp-creds
  namespace: {{ .Values.namespace | default "grafana-operator" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-amp-creds
    creationPolicy: Owner
  data:
  - secretKey: AMP_ENDPOINT_URL
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
      key: {{ .Values.clusterName }}/secrets
      property: amp_endpoint_url
  - secretKey: AWS_REGION
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
      key: {{ .Values.clusterName }}/secrets
      property: amp_region
{{- if and .Values.devlake (eq (toString .Values.devlake.enabled) "true") }}
---
# AWS: Grafana MySQL password + RDS endpoint URL from AWS Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mysql-creds
  namespace: {{ .Values.namespace | default "grafana-operator" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-mysql-creds
    creationPolicy: Owner
  data:
  - secretKey: GRAFANA_MYSQL_PASSWORD
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
      key: {{ .Values.clusterName }}/secrets
      property: grafana_mysql_password
  - secretKey: GRAFANA_MYSQL_URL
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
      key: {{ .Values.resourcePrefix | default "peeks" }}-devlake/mysql-connection
      property: db_url
{{- end }}
{{- end }}
