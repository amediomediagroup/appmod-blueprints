# Azure-specific addons — only deployed to clusters with cloud=azure label.
# All valuesObject fields use annotations injected by hub:seed-secret (no PII in code).

azure_cluster_secret_store:
  namespace: external-secrets
  path: '{{.metadata.annotations.addonsRepoBasepath}}addons/charts/azure-cluster-secret-store'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '-1'
  selector:
    matchExpressions:
      - key: enable_azure_cluster_secret_store
        operator: In
        values: ['true']
      - key: cloud
        operator: In
        values: ['azure']
  valuesObject:
    azure:
      keyVaultName: '{{default "" (index .metadata.annotations "azure_keyvault_name")}}'

agc_gateway:
  namespace: azure-alb-system
  releaseName: agc-gateway
  # Custom chart: manages ApplicationLoadBalancer + Gateway CRs only.
  # The ALB controller and its CRDs are installed by the AKS native AGC addon
  # (azure.agc.enabled=true in the Azure bootstrap configuration).
  # Readiness gate: native_agc.py sets agc_native_ready=true on the cluster Secret only
  # after all of: provider registrations Ready/Synced, UpdateResource Ready/Synced,
  # GatewayClass azure-alb-external Accepted, subnet delegated, NetworkContributor assigned.
  # Label absent on failure — this ApplicationSet will not deploy until it is present.
  path: '{{.metadata.annotations.addonsRepoBasepath}}addons/charts/agc-gateway'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  goTemplateOptions:
    - "missingkey=zero"
  selector:
    matchExpressions:
      - key: enable_agc_gateway
        operator: In
        values: ['true']
      - key: agc_native_ready
        operator: In
        values: ['true']
      - key: cloud
        operator: In
        values: ['azure']
  valuesObject:
    alb:
      # Full ARM subnet resource ID for the AGC-dedicated delegated subnet.
      # Supplied via the azure_agc_subnet_id cluster annotation (set by bootstrap).
      subnetId: '{{default "" (index .metadata.annotations "azure_agc_subnet_id")}}'
    gateway:
      allowedRoutesFrom: Selector
      allowedRoutesSelector:
        platform.gitops.io/ingress: agc
      tls:
        enabled: true
        # cert-manager issues this certificate for the real Azure-assigned hostname.
        hostname: '{{default "" (index .metadata.annotations "ingress_domain_name")}}'
        secretName: agc-apps-tls
    certificate:
      enabled: true
      issuerName: agc-letsencrypt
      acmeServer: https://acme-v02.api.letsencrypt.org/directory
