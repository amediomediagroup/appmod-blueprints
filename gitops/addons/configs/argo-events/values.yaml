# Argo Events values to fix NATS DNS resolution issues
# Argo Events v2.4.21 uses JetStream; NATS Streaming reached end of life.
# Keep a pinned server version, not a floating tag.
configs:
  jetstream:
    # One server is non-clustered, so the stream must not request replicas: 3.
    streamConfig:
      maxMsgs: 1000000
      maxAge: 72h
      maxBytes: 1GB
      replicas: 1
      duplicates: 300s
      retention: 0
      discard: 0
    versions:
      - version: 2.10.10
        natsImage: nats:2.10.10
        metricsExporterImage: natsio/prometheus-nats-exporter:0.14.0
        configReloaderImage: natsio/nats-server-config-reloader:0.14.0
        startCommand: /nats-server

# Override NATS clustering configuration to use full DNS names
controller:
  nodeSelector:
    karpenter.sh/nodepool: system
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
  config:
    eventBus:
      nats:
        native:
          # Use full cluster domain for DNS resolution
          clusterDomain: "cluster.local"
          # Ensure proper DNS resolution for clustering
          dnsPolicy: "ClusterFirst"
