# Namespaces whose HTTPRoutes must attach to the shared Application Gateway for
# Containers gateway. The gateway only admits routes from namespaces carrying
# this label, so the label has to be Git-owned rather than applied by hand.
#
# This file is the single owner of the admission label. Charts do not template
# it: two owners (chart + this manifest) made ArgoCD report "unchanged" forever
# while the live namespace stayed unlabelled.
apiVersion: v1
kind: Namespace
metadata:
  name: argo
  labels:
    platform.gitops.io/ingress: agc
---
apiVersion: v1
kind: Namespace
metadata:
  name: kargo
  labels:
    platform.gitops.io/ingress: agc
---
apiVersion: v1
kind: Namespace
metadata:
  name: devlake
  labels:
    platform.gitops.io/ingress: agc
---
apiVersion: v1
kind: Namespace
metadata:
  name: grafana
  labels:
    platform.gitops.io/ingress: agc
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    platform.gitops.io/ingress: agc
---
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
  labels:
    platform.gitops.io/ingress: agc
