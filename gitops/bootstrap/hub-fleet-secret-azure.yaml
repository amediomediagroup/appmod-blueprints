apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-fleet-secret-azure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    platform.gitops.io/deletion-safety: protected
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
    applicationsSync: create-update
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: control-plane
            cloud: azure
  template:
    metadata:
      name: 'fleet-secret-{{ index .metadata.annotations "azure_cluster_name" }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.fleetRepoURL }}'
          targetRevision: '{{ .metadata.annotations.fleetRepoRevision }}'
          ref: values
        - repoURL: '{{ or (index .metadata.annotations "overlay_repo_url") .metadata.annotations.fleetRepoURL }}'
          targetRevision: '{{ or (index .metadata.annotations "overlay_repo_revision") .metadata.annotations.fleetRepoRevision }}'
          ref: overlay
        - repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
          targetRevision: '{{ .metadata.annotations.addonsRepoRevision }}'
          path: 'platform-charts/fleet-secret'
          helm:
            releaseName: 'fleet-secret-{{ index .metadata.annotations "azure_cluster_name" }}'
            ignoreMissingValueFiles: true
            valuesObject:
              mode: externalSecret
              clusterName: '{{ index .metadata.annotations "azure_cluster_name" }}'
              externalSecret:
                enabled: true
                creationPolicy: Merge
                # Uses azure-key-vault ClusterSecretStore instead of aws-secrets-manager
                secretStoreRefName: azure-key-vault
                secretStoreRefKind: ClusterSecretStore
                # Azure KV forbids '/' in secret names; keyvault:seed writes <cluster>-config.
                # remoteRefKey overrides the default <clusterName>/config ESO key.
                remoteRefKey: '{{ index .metadata.annotations "azure_cluster_name" }}-config'
            valueFiles:
              - '$values/{{ .metadata.annotations.fleetRepoBasepath }}fleet/hub-azure/values.yaml'
              - '$values/{{ .metadata.annotations.fleetRepoBasepath }}overlays/environments/control-plane-azure/enabled-addons.yaml'
              - '$values/{{ .metadata.annotations.fleetRepoBasepath }}overlays/clusters/{{ index .metadata.annotations "azure_cluster_name" }}/addon-overrides.yaml'
              - '$overlay/{{ index .metadata.annotations "overlay_repo_basepath" }}overlays/environments/control-plane-azure/enabled-addons.yaml'
              - '$overlay/{{ index .metadata.annotations "overlay_repo_basepath" }}overlays/clusters/{{ index .metadata.annotations "azure_cluster_name" }}/addon-overrides.yaml'
      destination:
        name: '{{ .name }}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /status
            - /metadata/generation
            - /metadata/managedFields
