{{- range $name, $cluster := .Values.clusters }}
{{- with $cluster.userNodePool }}
{{- $pool := . }}
{{- $poolName := required "userNodePool.name is required" $pool.name }}
{{- $subscription := $cluster.subscriptionId | default $.Values.global.subscriptionId | required "azure subscriptionId required" }}
{{- $resourceGroup := required "azure resourceGroup required" $cluster.resourceGroup }}
---
apiVersion: containerservice.azure.upbound.io/v1beta2
kind: KubernetesClusterNodePool
metadata:
  name: {{ printf "%s-%s" $cluster.clusterName $poolName }}
  annotations:
    crossplane.io/external-name: {{ $poolName | quote }}
  labels:
    platform.gitops.io/cluster: {{ $cluster.clusterName | quote }}
spec:
  deletionPolicy: Orphan
  managementPolicies:
    {{- toYaml ($pool.managementPolicies | default (list "Observe")) | nindent 4 }}
  providerConfigRef:
    name: {{ $pool.providerConfigName | default "default" | quote }}
  forProvider:
    kubernetesClusterId: {{ printf "/subscriptions/%s/resourceGroups/%s/providers/Microsoft.ContainerService/managedClusters/%s" $subscription $resourceGroup $cluster.clusterName | quote }}
    vmSize: {{ required "userNodePool.vmSize is required" $pool.vmSize | quote }}
    nodeCount: {{ dig "nodeCount" 1 $pool }}
    autoScalingEnabled: false
    mode: User
    osType: Linux
    osSku: {{ $pool.osSku | default "AzureLinux3" | quote }}
    osDiskSizeGb: {{ $pool.osDiskSizeGb | default 128 }}
    osDiskType: Managed
    maxPods: {{ $pool.maxPods | default 110 }}
    {{- with $pool.nodeLabels }}
    nodeLabels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    vnetSubnetId: {{ required "userNodePool.subnetId is required" $pool.subnetId | quote }}
    upgradeSettings:
      maxSurge: {{ $pool.maxSurge | default "1" | quote }}
{{- end }}
{{- end }}
