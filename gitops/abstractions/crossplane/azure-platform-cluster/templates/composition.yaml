apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: azure-platform-cluster
  labels:
    provider: azure
spec:
  compositeTypeRef:
    apiVersion: platform.gitops.io/v1alpha1
    kind: XAzurePlatformCluster
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:

          # ── 1. Resource Group ─────────────────────────────────────────────
          - name: resource-group
            base:
              apiVersion: azure.upbound.io/v1beta1
              kind: ResourceGroup
              spec:
                forProvider:
                  location: ""
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.location
                toFieldPath: spec.forProvider.location
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations["crossplane.io/external-name"]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-rg"

          # ── 2. Virtual Network ────────────────────────────────────────────
          - name: vnet
            base:
              apiVersion: network.azure.upbound.io/v1beta2
              kind: VirtualNetwork
              spec:
                forProvider:
                  location: ""
                  resourceGroupNameSelector:
                    matchControllerRef: true
                  addressSpace: []
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.location
                toFieldPath: spec.forProvider.location
              - type: FromCompositeFieldPath
                fromFieldPath: spec.vnetCidr
                toFieldPath: spec.forProvider.addressSpace[0]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.agcSubnetCidr
                toFieldPath: spec.forProvider.addressSpace[1]
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations["crossplane.io/external-name"]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-vnet"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.vnetId

          # ── 3. Subnet — system node pool ─────────────────────────────────
          # Label role:system required by AKS vnetSubnetIdSelector
          - name: subnet-system
            base:
              apiVersion: network.azure.upbound.io/v1beta2
              kind: Subnet
              metadata:
                labels:
                  role: system
              spec:
                forProvider:
                  resourceGroupNameSelector:
                    matchControllerRef: true
                  virtualNetworkNameSelector:
                    matchControllerRef: true
                  addressPrefixes:
                    - "10.240.0.0/16"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations["crossplane.io/external-name"]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-system-snet"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.nodepoolSubnetId

          # ── 4. Subnet — user node pool ────────────────────────────────────
          - name: subnet-user
            base:
              apiVersion: network.azure.upbound.io/v1beta2
              kind: Subnet
              spec:
                forProvider:
                  resourceGroupNameSelector:
                    matchControllerRef: true
                  virtualNetworkNameSelector:
                    matchControllerRef: true
                  addressPrefixes:
                    - "10.241.0.0/16"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations["crossplane.io/external-name"]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-user-snet"

          # ── 5. UAMI — kubelet identity ────────────────────────────────────
          - name: uami-kubelet
            base:
              apiVersion: managedidentity.azure.upbound.io/v1beta1
              kind: UserAssignedIdentity
              metadata:
                labels:
                  role: kubelet-identity
              spec:
                forProvider:
                  location: ""
                  resourceGroupNameSelector:
                    matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.location
                toFieldPath: spec.forProvider.location
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-kubelet-mi"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.kubeletMiId
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.principalId
                toFieldPath: status.kubeletPrincipalId

          # ── 6. UAMI — ESO identity ────────────────────────────────────────
          - name: uami-eso
            base:
              apiVersion: managedidentity.azure.upbound.io/v1beta1
              kind: UserAssignedIdentity
              metadata:
                labels:
                  role: eso-identity
              spec:
                forProvider:
                  location: ""
                  resourceGroupNameSelector:
                    matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.location
                toFieldPath: spec.forProvider.location
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-eso-mi"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.clientId
                toFieldPath: status.esoMiClientId
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.principalId
                toFieldPath: status.esoPrincipalId

          # ── 7. UAMI — ALB Controller identity ────────────────────────────
          # ALB Controller uses Workload Identity to manage Application Gateway for Containers
          - name: uami-alb
            base:
              apiVersion: managedidentity.azure.upbound.io/v1beta1
              kind: UserAssignedIdentity
              metadata:
                labels:
                  role: alb-identity
              spec:
                forProvider:
                  location: ""
                  resourceGroupNameSelector:
                    matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.location
                toFieldPath: spec.forProvider.location
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-alb-mi"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.clientId
                toFieldPath: status.albMiClientId
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.principalId
                toFieldPath: status.albPrincipalId

          # ── 8. AKS Cluster ────────────────────────────────────────────────
          # Note: NO ingressApplicationGateway addon — AGC is managed by ALB Controller
          # Depends on: uami-kubelet (kubeletMiId), subnet-system (nodepoolSubnetId)
          - name: aks-cluster
            base:
              apiVersion: containerservice.azure.upbound.io/v1beta2
              kind: KubernetesCluster
              spec:
                forProvider:
                  location: ""
                  resourceGroupNameSelector:
                    matchControllerRef: true
                  kubernetesVersion: ""
                  dnsPrefix: ""
                  identity:
                    type: UserAssigned
                    identityIds: []
                  defaultNodePool:
                    name: system
                    vmSize: ""
                    autoScalingEnabled: true
                    minCount: 1
                    maxCount: 1
                    # Existing platform charts select this label; Azure pool mode is unchanged.
                    nodeLabels:
                      karpenter.sh/nodepool: system
                    upgradeSettings:
                      # AKS rejects maxSurge=0 unless maxUnavailable>0, and this
                      # provider does not expose maxUnavailable. Surge only
                      # applies during upgrades; creation needs no extra node.
                      maxSurge: "1"
                    vnetSubnetIdSelector:
                      matchControllerRef: true
                      matchLabels:
                        role: system
                  networkProfile:
                    networkPlugin: azure
                    networkPolicy: calico
                    serviceCidr: "10.0.0.0/16"
                    dnsServiceIp: "10.0.0.10"
                  oidcIssuerEnabled: true
                  workloadIdentityEnabled: true
                writeConnectionSecretToRef:
                  namespace: crossplane-system
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.location
                toFieldPath: spec.forProvider.location
              - type: FromCompositeFieldPath
                fromFieldPath: spec.kubernetesVersion
                toFieldPath: spec.forProvider.kubernetesVersion
              - type: FromCompositeFieldPath
                fromFieldPath: spec.systemNodeSize
                toFieldPath: spec.forProvider.defaultNodePool.vmSize
              - type: FromCompositeFieldPath
                fromFieldPath: spec.systemNodeMin
                toFieldPath: spec.forProvider.defaultNodePool.minCount
              - type: FromCompositeFieldPath
                fromFieldPath: spec.systemNodeMax
                toFieldPath: spec.forProvider.defaultNodePool.maxCount
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.dnsPrefix
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations["crossplane.io/external-name"]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-kubeconfig"
              - type: FromCompositeFieldPath
                fromFieldPath: status.kubeletMiId
                policy:
                  fromFieldPath: Required
                toFieldPath: spec.forProvider.identity.identityIds[0]
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.aksId
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.oidcIssuerUrl
                toFieldPath: status.oidcIssuerUrl
            connectionDetails:
              - name: kubeconfig
                type: FromConnectionSecretKey
                fromConnectionSecretKey: kubeconfig

          # ── 9. Key Vault ──────────────────────────────────────────────────
          - name: key-vault
            base:
              apiVersion: keyvault.azure.upbound.io/v1beta2
              kind: Vault
              spec:
                forProvider:
                  location: ""
                  resourceGroupNameSelector:
                    matchControllerRef: true
                  skuName: standard
                  tenantId: ""
                  rbacAuthorizationEnabled: true
                  softDeleteRetentionDays: 7
                  purgeProtectionEnabled: false
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.location
                toFieldPath: spec.forProvider.location
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.tenantId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations["crossplane.io/external-name"]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%.12s-kv"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.vaultUri
                toFieldPath: status.keyVaultUrl
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.keyVaultId

          # ── 10. Role Assignment — kubelet → Network Contributor on VNet ───
          - name: role-kubelet-network
            base:
              apiVersion: authorization.azure.upbound.io/v1beta1
              kind: RoleAssignment
              spec:
                forProvider:
                  roleDefinitionName: "Network Contributor"
                  principalId: ""
                  scope: ""
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: status.vnetId
                policy:
                  fromFieldPath: Required
                toFieldPath: spec.forProvider.scope
              - type: FromCompositeFieldPath
                fromFieldPath: status.kubeletPrincipalId
                policy:
                  fromFieldPath: Required
                toFieldPath: spec.forProvider.principalId

          # ── 11. Role Assignment — ESO → Key Vault Secrets User ────────────
          - name: role-eso-keyvault
            base:
              apiVersion: authorization.azure.upbound.io/v1beta1
              kind: RoleAssignment
              spec:
                forProvider:
                  roleDefinitionName: "Key Vault Secrets User"
                  principalId: ""
                  scope: ""
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: status.keyVaultId
                policy:
                  fromFieldPath: Required
                toFieldPath: spec.forProvider.scope
              - type: FromCompositeFieldPath
                fromFieldPath: status.esoPrincipalId
                policy:
                  fromFieldPath: Required
                toFieldPath: spec.forProvider.principalId

          # ── 12. Role Assignment — ALB → AppGw for Containers Config Manager
          # Grants the ALB Controller identity permission to manage AGC resources
          # Built-in role: "AppGw for Containers Configuration Manager"
          - name: role-alb-rg
            base:
              apiVersion: authorization.azure.upbound.io/v1beta1
              kind: RoleAssignment
              spec:
                forProvider:
                  roleDefinitionName: "AppGw for Containers Configuration Manager"
                  principalId: ""
                  scope: ""
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.subscriptionId
                    - fromFieldPath: spec.clusterName
                  strategy: string
                  string:
                    fmt: "/subscriptions/%s/resourceGroups/%s-rg"
                toFieldPath: spec.forProvider.scope
              - type: FromCompositeFieldPath
                fromFieldPath: status.albPrincipalId
                policy:
                  fromFieldPath: Required
                toFieldPath: spec.forProvider.principalId

          # ── 13. FIC — ESO workload identity on the AKS issuer ─────────────
          - name: fic-eso
            base:
              apiVersion: managedidentity.azure.upbound.io/v1beta1
              kind: FederatedIdentityCredential
              spec:
                forProvider:
                  audience:
                    - api://AzureADTokenExchange
                  issuer: ""
                  subject: "system:serviceaccount:external-secrets:external-secrets-sa"
                  parentIdSelector:
                    matchControllerRef: true
                    matchLabels:
                      role: eso-identity
                  resourceGroupNameSelector:
                    matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: status.oidcIssuerUrl
                policy:
                  fromFieldPath: Required
                toFieldPath: spec.forProvider.issuer
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations["crossplane.io/external-name"]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-eso-aks"

          # ── 14. FIC — ALB Controller workload identity on the AKS issuer ──
          - name: fic-alb
            base:
              apiVersion: managedidentity.azure.upbound.io/v1beta1
              kind: FederatedIdentityCredential
              spec:
                forProvider:
                  audience:
                    - api://AzureADTokenExchange
                  issuer: ""
                  subject: "system:serviceaccount:azure-alb-system:alb-controller-sa"
                  parentIdSelector:
                    matchControllerRef: true
                    matchLabels:
                      role: alb-identity
                  resourceGroupNameSelector:
                    matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: status.oidcIssuerUrl
                policy:
                  fromFieldPath: Required
                toFieldPath: spec.forProvider.issuer
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations["crossplane.io/external-name"]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-alb-aks"
